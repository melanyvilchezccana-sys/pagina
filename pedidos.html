<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Panadería Dulce Aroma</title>

    <link rel="stylesheet" href="estilo2.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header class="main-header">
    <div class="logo">
        <h1>🍞 Dulce Aroma</h1>
    </div>

    <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="promociones.html">Promociones</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contactos.html">Contacto</a>
        <a href="pedidos.html" class="active">Pedidos</a>
        <a href="galeria.html">Galería</a>
    </nav>
</header>

<section class="form-section">
    <div class="form-container">

        <h1 class="title">Realizar Pedido</h1>
        <p class="subtitle">Completa el formulario para hacer tu pedido</p>

        <form class="pedido-form" id="formPedido">

            <div class="input-group">
                <label>Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ingrese su nombre" required>
            </div>

            <div class="input-group">
                <label>Teléfono</label>
                <input type="tel" id="telefono" placeholder="Ingrese su teléfono" required>
            </div>

            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="correo" placeholder="Ingrese su correo" required>
            </div>

            <div class="input-group">
                <label>Producto</label>
                <select id="producto" required>
                    <option value="">Seleccione un producto</option>
                    <option>Pan Francés</option>
                    <option>Pan Integral</option>
                    <option>Baguette</option>
                    <option>Ciabatta</option>
                    <option>Torta Chocolate</option>
                    <option>Torta Fresa</option>
                    <option>Cheesecake</option>
                    <option>Donas</option>
                    <option>Brownies</option>
                    <option>Empanadas</option>
                </select>
            </div>

            <div class="input-group">
                <label>Cantidad</label>
                <input type="number" id="cantidad" min="1" placeholder="Cantidad" required>
            </div>

            <div class="input-group">
                <label>Dirección de Entrega</label>
                <textarea id="direccion" rows="4" placeholder="Ingrese su dirección"></textarea>
            </div>

            <button type="submit" class="btn-main">
                <i class="fa-solid fa-paper-plane"></i>
                Enviar Pedido
            </button>

        </form>

    </div>
</section>

<footer>
    <div class="social">
        <a href="https://www.facebook.com/share/17LadnNqA2/"><i class="fa-brands fa-facebook"></i></a>
        <a href="https://www.instagram.com/dulcearoma701?igsh=MWx4bjVhNXU1Z2lqbg=="><i class="fa-brands fa-instagram"></i></a>
        <a href="https://whatsapp.com/channel/0029VbCTPSIFHWpzkdMfXe18"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="https://www.tiktok.com/@panadera.dulce.ar2?_r=1&_t=ZS-95s2xMJAz9J"><i class="fa-brands fa-tiktok"></i></a>
    </div>

    <p>© 2026 Panadería Dulce Aroma - Todos los derechos reservados</p>
</footer>

<!-- SCRIPT FUNCIONAL -->
<script>
document.getElementById("formPedido").addEventListener("submit", function(e) {
    e.preventDefault();

    let nombre = document.getElementById("nombre").value;
    let telefono = document.getElementById("telefono").value;
    let correo = document.getElementById("correo").value;
    let producto = document.getElementById("producto").value;
    let cantidad = document.getElementById("cantidad").value;
    let direccion = document.getElementById("direccion").value;

    let mensaje = "🧾 *NUEVO PEDIDO*%0A";
    mensaje += "👤 Nombre: " + nombre + "%0A";
    mensaje += "📞 Teléfono: " + telefono + "%0A";
    mensaje += "📧 Correo: " + correo + "%0A";
    mensaje += "🍞 Producto: " + producto + "%0A";
    mensaje += "🔢 Cantidad: " + cantidad + "%0A";
    mensaje += "📍 Dirección: " + direccion + "%0A";

    let numero = "51999999999"; // 🔴 CAMBIA POR TU NÚMERO REAL
    let url = "https://wa.me/" + numero + "?text=" + mensaje;

    window.open(url, "_blank");
});
</script>

</body>
</html>
