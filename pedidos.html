    <!-- FORMULARIO -->
    <section class="form-section">

        <div class="form-container">

            <h1 class="title">

                Realizar Pedido

            </h1>

            <p class="subtitle">

                Completa el formulario para hacer tu pedido

            </p>

            <form class="pedido-form">

                <!-- NOMBRE -->
                <div class="input-group">

                    <label>

                        Nombre Completo

                    </label>

                    <input type="text" placeholder="Ingrese su nombre" required>

                </div>

                <!-- TELÉFONO -->
                <div class="input-group">

                    <label>

                        Teléfono

                    </label>

                    <input type="tel" placeholder="Ingrese su teléfono" required>

                </div>

                <!-- CORREO -->
                <div class="input-group">

                    <label>

                        Correo Electrónico

                    </label>

                    <input type="email" placeholder="Ingrese su correo" required>

                </div>

                <!-- PRODUCTO -->
                <div class="input-group">

                    <label>

                        Producto

                    </label>

                    <select required>

                        <option value="">
                            Seleccione un producto
                        </option>

                        <option>
                            Pan Francés
                        </option>

                        <option>
                            Croissant
                        </option>

                        <option>
                            Torta de Chocolate
                        </option>

                        <option>
                            Donas
                        </option>

                    </select>

                </div>

                <!-- CANTIDAD -->
                <div class="input-group">

                    <label>

                        Cantidad

                    </label>

                    <input type="number" min="1" placeholder="Cantidad" required>

                </div>

                <!-- DIRECCIÓN -->
                <div class="input-group">

                    <label>

                        Dirección de Entrega

                    </label>

                    <textarea rows="4"
                        placeholder="Ingrese su dirección"></textarea>

                </div>

                <!-- BOTÓN -->
                <button type="submit" class="btn-main">

                    <i class="fa-solid fa-paper-plane"></i>

                    Enviar Pedido

                </button>

            </form>

        </div>

    </section>
